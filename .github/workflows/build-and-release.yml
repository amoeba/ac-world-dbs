name: Build common release and deploy

on:
  push:
    branches:
      - main
    paths:
      - "meta.toml"
      - "scripts/**"
      - ".github/workflows/build-and-release.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full zstd
          python3 -m pip install datasette
          python3 -m pip install "db-to-sqlite @ git+https://github.com/amoeba/db-to-sqlite#egg=db-to-sqlite[mysql]"

      - name: Start MySQL
        run: |
          docker run -d --name mysql \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=ace_world \
            -p 3306:3306 \
            mysql:8
          until mysql -h 127.0.0.1 -P 3306 -u root -proot -e "SELECT 1"; do
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Convert configured databases
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
        run: |
          mkdir -p databases
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          with open("meta.toml", "rb") as f:
              config = tomllib.load(f)

          repo = os.environ["RELEASE_REPO"]

          for name, entry in config.items():
              raw_tag = entry.get("raw_release_tag", f"raw-{name}")
              asset_name = f"{name}.sql"

              print(f"Downloading raw SQL for {name} from {raw_tag}...")
              subprocess.run(
                  ["gh", "release", "download", raw_tag, "--repo", repo, "--pattern", f"{name}.sql.zst", "--dir", "raw"],
                  check=True,
              )

              raw_dir = Path("raw")
              asset = raw_dir / f"{name}.sql.zst"
              if not asset.exists():
                  raise RuntimeError(f"No raw SQL asset found for {name}")

              sql_file = Path("databases") / f"{name}.sql"
              print(f"Decompressing {asset.name}...")
              subprocess.run(["zstd", "-dc", str(asset)], stdout=open(sql_file, "wb"), check=True)

              db_file = Path("databases") / f"{name}.db"
              print(f"Converting {name} to SQLite...")
              subprocess.run(
                  ["sh", "scripts/convert_mysql_to_sqlite.sh", str(sql_file), str(db_file), name],
                  check=True,
                  env={**os.environ, "MYSQL_HOST": "127.0.0.1", "MYSQL_PORT": "3306", "MYSQL_USER": "root", "MYSQL_PASSWORD": "root"},
              )

              print(f"Compressing raw SQL for {name} with zstd...")
              subprocess.run(["zstd", "-19", "-T0", "-f", str(sql_file)], check=True)

              # Clean up raw download for next iteration.
              for f in raw_dir.iterdir():
                  f.unlink()
          PY

      - name: Build meta database
        run: uv run scripts/build_meta_db.py

      - name: Determine next versioned release
        id: version
        run: |
          LATEST=$(gh release list --repo "$RELEASE_REPO" --limit 50 --json tagName -q '.[].tagName' | grep -E '^v[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -z "$LATEST" ]; then
            echo "tag=v1" >> "$GITHUB_OUTPUT"
          else
            NUM=$(echo "$LATEST" | sed 's/^v//')
            echo "tag=v$((NUM + 1))" >> "$GITHUB_OUTPUT"
          fi

      - name: Create versioned release with all assets
        run: |
          NEXT_TAG="${{ steps.version.outputs.tag }}"
          gh release create "$NEXT_TAG" \
            --repo "$RELEASE_REPO" \
            --title "$NEXT_TAG" \
            --notes "Common release with all converted databases."
          gh release upload "$NEXT_TAG" databases/ace_world_*.db databases/*.sql.zst databases/meta.db --repo "$RELEASE_REPO" --clobber

      - name: Update latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -d latest || true
          git push origin :refs/tags/latest || true
          git tag -a latest -m "latest"
          git push origin latest --force

  deploy_to_dokku:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Push to Dokku
        uses: dokku/github-action@v1.10.0
        with:
          git_remote_url: 'ssh://dokku@${{ secrets.DOKKU_HOST }}/${{ secrets.DOKKU_APP_NAME }}'
          ssh_private_key: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
          branch: main
