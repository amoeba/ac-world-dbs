name: Build common release and deploy

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - "meta.toml"
      - "scripts/**"
      - ".github/workflows/build-and-release.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full zstd
          uv venv .venv
          uv pip install -r requirements.txt

      - name: Start MySQL
        run: |
          docker run -d --name mysql \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=ace_world \
            -p 3306:3306 \
            mysql:8
          until mysql -h 127.0.0.1 -P 3306 -u root -proot -e "SELECT 1"; do
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Convert configured databases
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
        run: |
          mkdir -p databases
          uv run python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          from scripts.build_meta_db import db_name_from_config

          with open("meta.toml", "rb") as f:
              config = tomllib.load(f)

          repo = os.environ["RELEASE_REPO"]
          databases_dir = Path("databases")
          manifest_path = databases_dir / "manifest.json"

          # Resolve the newest versioned common release (v1, v2, ...). Raw
          # dump releases (raw-*) are excluded so they never hijack this.
          result = subprocess.run(
              ["gh", "release", "list", "--repo", repo, "--limit", "100", "--json", "tagName"],
              check=True,
              capture_output=True,
              text=True,
          )
          tags = [r["tagName"] for r in json.loads(result.stdout)]
          versioned = sorted(
              (t for t in tags if re.match(r"^v[0-9]+$", t)),
              key=lambda t: int(t[1:]),
          )
          prev_tag = versioned[-1] if versioned else ""
          prev_manifest = {}
          if prev_tag:
              print(f"Latest release: {prev_tag}")
              try:
                  subprocess.run(
                      ["gh", "release", "download", prev_tag, "--repo", repo, "--pattern", "manifest.json", "--dir", "databases"],
                      check=True,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
                  prev_manifest = json.loads(manifest_path.read_text())
                  print(f"Loaded manifest from {prev_tag}: {list(prev_manifest.keys())}")
              except subprocess.CalledProcessError:
                  print("No previous manifest found; converting all databases.")
              except FileNotFoundError:
                  print("manifest.json not downloaded; converting all databases.")
          else:
              print("Could not resolve latest release; converting all databases.")

          manifest = {}

          for section, entry in config.items():
              name = db_name_from_config(entry)
              raw_tag = entry.get("raw_release_tag", f"raw-{section}")
              raw_asset_name = f"{section}.sql.zst"

              # Get raw asset metadata without downloading the whole file.
              result = subprocess.run(
                  ["gh", "release", "view", raw_tag, "--repo", repo, "--json", "assets"],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              release_info = json.loads(result.stdout)
              raw_asset = next(
                  (a for a in release_info.get("assets", []) if a["name"] == raw_asset_name),
                  None,
              )
              if raw_asset is None:
                  raise RuntimeError(f"No {raw_asset_name} asset found in {raw_tag}")

              raw_size = raw_asset["size"]
              manifest[name] = {"raw_size": raw_size}

              db_file = databases_dir / f"{name}.db"
              sql_file = databases_dir / f"{name}.sql"
              cached_size = prev_manifest.get(name, {}).get("raw_size")

              if cached_size == raw_size and db_file.exists():
                  print(f"{name}: raw asset unchanged ({raw_size} bytes), reusing cached {db_file.name}")
              else:
                  if cached_size == raw_size:
                      print(f"{name}: manifest matches but {db_file.name} missing; converting.")
                  else:
                      print(f"{name}: raw asset changed ({cached_size} -> {raw_size}); converting.")

                  print(f"Downloading raw SQL for {name} from {raw_tag}...")
                  subprocess.run(
                      ["gh", "release", "download", raw_tag, "--repo", repo, "--pattern", raw_asset_name, "--dir", "raw"],
                      check=True,
                  )

                  raw_dir = Path("raw")
                  asset = raw_dir / raw_asset_name
                  if not asset.exists():
                      raise RuntimeError(f"No raw SQL asset found for {name}")

                  print(f"Decompressing {asset.name}...")
                  subprocess.run(["zstd", "-dc", str(asset)], stdout=open(sql_file, "wb"), check=True)

                  print(f"Converting {name} to SQLite...")
                  subprocess.run(
                      ["sh", "scripts/convert_mysql_to_sqlite.sh", str(sql_file), str(db_file), "ace_world"],
                      check=True,
                      env={**os.environ, "MYSQL_HOST": "127.0.0.1", "MYSQL_PORT": "3306", "MYSQL_USER": "root", "MYSQL_PASSWORD": "root"},
                  )

                  # Clean up raw download for next iteration.
                  for f in raw_dir.iterdir():
                      f.unlink()

              # Always produce a fresh .sql.zst for the common release; this is
              # fast compared to the MySQL conversion.
              if not sql_file.exists():
                  print(f"Decompressing cached raw SQL for {name}...")
                  subprocess.run(
                      ["zstd", "-dc", str(db_file.with_suffix(".sql.zst"))],
                      stdout=open(sql_file, "wb"),
                      check=True,
                  )
              print(f"Compressing raw SQL for {name} with zstd...")
              subprocess.run(["zstd", "-19", "-T0", "-f", str(sql_file)], check=True)

          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True))
          print(f"Wrote manifest: {manifest_path}")
          PY

      - name: Determine next versioned release
        id: version
        run: |
          LATEST=$(gh release list --repo "$RELEASE_REPO" --limit 50 --json tagName -q '.[].tagName' | grep -E '^v[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -z "$LATEST" ]; then
            echo "tag=v1" >> "$GITHUB_OUTPUT"
          else
            NUM=$(echo "$LATEST" | sed 's/^v//')
            echo "tag=v$((NUM + 1))" >> "$GITHUB_OUTPUT"
          fi

      - name: Build meta database
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: uv run scripts/build_meta_db.py

      - name: Create versioned release with all assets
        run: |
          NEXT_TAG="${{ steps.version.outputs.tag }}"
          gh release create "$NEXT_TAG" \
            --repo "$RELEASE_REPO" \
            --title "$NEXT_TAG" \
            --notes "Common release with all converted databases."
          # Upload via the REST API with curl. `gh release upload` can fail
          # with "HTTP 400: Bad Content-Length" on large assets from runners,
          # and uploads.github.com is intermittently degraded, so we retry
          # with escalating backoff and print the response body on failure.
          # Chunked transfer encoding is NOT used (it is rejected with 400).
          RELEASE_ID=$(gh api "repos/$RELEASE_REPO/releases/tags/$NEXT_TAG" --jq '.id')
          fail=0
          for f in databases/*.db databases/*.sql.zst databases/manifest.json; do
            ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              if out=$(curl -sS --fail-with-body -w "HTTP_CODE=%{http_code}" -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@$f" \
                "https://uploads.github.com/repos/$RELEASE_REPO/releases/$RELEASE_ID/assets?name=$(basename "$f")" 2>&1); then
                echo "Uploaded $f"
                ok=1
                break
              fi
              echo "Upload of $f failed on attempt $attempt:"
              echo "$out" | head -c 1500
              echo
              # A partial asset may linger after a failed attempt; drop it.
              asset_id=$(gh api "repos/$RELEASE_REPO/releases/tags/$NEXT_TAG" \
                --jq ".assets[] | select(.name == \"$(basename "$f")\") | .id" 2>/dev/null | head -n 1)
              if [ -n "$asset_id" ]; then
                gh api -X DELETE "repos/$RELEASE_REPO/releases/assets/$asset_id" >/dev/null 2>&1 || true
              fi
              case "$attempt" in
                1|2|3) sleep 5 ;;
                4) sleep 60 ;;
                5) sleep 120 ;;
                *) sleep 300 ;;
              esac
            done
            if [ "$ok" -ne 1 ]; then
              echo "FAILED to upload $f after retries" >&2
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

  deploy_to_dokku:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Push to Dokku
        uses: dokku/github-action@v1.10.0
        with:
          git_remote_url: 'ssh://dokku@${{ secrets.DOKKU_HOST }}/${{ secrets.DOKKU_APP_NAME }}'
          ssh_private_key: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
          branch: main
