name: Rebuild meta database

on:
  push:
    branches:
      - main
    paths:
      - "databases.toml"
      - "scripts/build_meta_db.py"
      - ".github/workflows/build-and-release.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6

      - name: Download database assets from latest release
        run: |
          mkdir -p databases
          gh release download latest \
            --repo "$RELEASE_REPO" \
            --pattern "*.db" \
            --dir databases || true

      - name: Build meta database
        run: uv run scripts/build_meta_db.py

      - name: Upload meta.db to latest release
        run: |
          gh release upload latest ./databases/meta.db --repo "$RELEASE_REPO" --clobber
