name: Build and release databases

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6

      - name: Create test databases
        run: uv run scripts/create_test_dbs.py

      - name: Build meta database
        run: uv run scripts/build_meta_db.py

      - uses: actions/upload-artifact@v7
        with:
          name: databases
          path: ./databases/*.db

      - name: Release databases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -d latest || true
          git push origin :refs/tags/latest || true
          git tag -a latest -m "latest"
          git push --tags
          gh release upload latest ./databases/*.db --clobber || \
            gh release create latest ./databases/*.db --title "latest" --notes "Latest world databases"

  deploy_to_dokku:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Push to Dokku
        uses: dokku/github-action@v1.10.0
        with:
          git_remote_url: 'ssh://dokku@${{ secrets.DOKKU_HOST }}/${{ secrets.DOKKU_APP_NAME }}'
          ssh_private_key: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
          branch: main
